<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Kite Ops</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>
  <button class="nav-toggle" id="navToggle">☰</button>
  <div id="shell">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-mark"><img src="/logo-mark.png" alt="Blue Kite Media" /></div>
        <div><div class="brand-name">Blue Kite Media</div><div class="brand-sub">Production Ops</div></div>
      </div>
      <div class="role-box" id="roleBox"></div>
      <nav class="nav">
        <a href="#/" class="nav-link" data-route="/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
        <a href="#/board" class="nav-link" data-route="/board"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="10" rx="1.5"/></svg>My Board</a>
        <a href="#/timelog" class="nav-link" data-route="/timelog"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>TimeLog</a>
        <a href="#/connect" class="nav-link" data-route="/connect"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/></svg>Connect</a>
        <a href="#/team" class="nav-link" data-route="/team" id="navTeam" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Team</a>
        <a href="#/admin" class="nav-link" data-route="/admin" id="navAdmin" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4z"/></svg>Admin</a>
        <div class="nav-section-label">Clients</div>
        <div id="clientNavList"><div class="skeleton" style="height:32px;margin:4px 10px;"></div></div>
        <button class="nav-add" id="navAddClient" hidden>+ Add client</button>
      </nav>
      <div id="musicPlayerBox"></div>
      <div class="sidebar-foot">
        <span id="whoAmI"></span>
        <div style="display:flex;align-items:center;gap:6px;">
          <button type="button" class="theme-toggle" id="themeToggle" title="Toggle light/dark theme">◐</button>
          <button type="button" class="role-change-btn" id="signOutBtn" hidden>Sign out</button>
        </div>
      </div>
    </aside>
    <main id="main"><div id="app"><div class="skeleton" style="height:200px;"></div></div></main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
