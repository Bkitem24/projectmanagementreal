[package]
name = "blue-kite-ops"
version = "0.1.0"
description = "Blue Kite Ops - production board desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native "Save As" dialog + file write, used for downloading task
# attachments reliably (see src/lib/r2.js's downloadProtectedFile) — a
# browser-only blob-URL-click download is flaky inside the WebView2 shell
# on Windows, which is what testing was actually hitting.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# "Open folder" after a Meetings recording finishes (src/lib/recorder.js's
# revealInFolder) - the official Tauri v2 replacement for v1's shell.open.
tauri-plugin-opener = "2"

# Launch on Windows startup needs no crate and no Rust code at all - it's a
# schtasks.exe Scheduled Task created by the NSIS INSTALLER itself
# (installer-hooks.nsh), not by the running app. See src/main.rs's header
# comment for the two earlier approaches (a registry Run-key plugin, then a
# runtime schtasks.exe call from this app's own .setup() hook) and why both
# were replaced - the second one worked but got the app deleted by Windows
# Defender as a malware-persistence false positive.

# TimeLog (src/timelog.rs): screen capture + global keyboard/mouse activity.
#
# Version note: this sandbox has no network access to crates.io, so these
# couldn't be resolved/compiled here to pin exact known-good versions (see
# the header comment in src/timelog.rs). Left unpinned ("*") on purpose so
# that whichever machine actually builds this (the GitHub Actions Windows
# workflow, or your own machine) resolves the current latest release from
# crates.io itself, rather than trusting a version number I couldn't verify.
# Once a build succeeds, it's worth pinning these to the resolved versions
# (copy them out of the generated Cargo.lock) so future builds are
# reproducible instead of silently picking up new majors.
xcap = "*"
rdev = "*"
image = "*"
tokio = { version = "1.53.1", features = ["sync"] }
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"

[[bin]]
name = "blue-kite-ops"
path = "src/main.rs"
