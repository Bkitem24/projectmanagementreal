[package]
name = "blue-kite-ops"
version = "0.1.0"
description = "Blue Kite Ops — production board desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native "Save As" dialog + file write, used for downloading task
# attachments reliably (see src/lib/r2.js's downloadProtectedFile) — a
# browser-only blob-URL-click download is flaky inside the WebView2 shell
# on Windows, which is what testing was actually hitting.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Phase 2.5 batch A follow-up: launch on Windows startup is now done with a
# direct schtasks.exe Scheduled Task call from src/main.rs's .setup() hook
# (register_autostart_task()) instead of a plugin - see the long comment
# there for why the registry-based tauri-plugin-autostart approach (removed
# here) didn't actually work on this app. No autostart crate needed at all
# any more; std::process::Command is enough.

# TimeLog (src/timelog.rs): screen capture + global keyboard/mouse activity.
#
# Version note: this sandbox has no network access to crates.io, so these
# couldn't be resolved/compiled here to pin exact known-good versions (see
# the header comment in src/timelog.rs). Left unpinned ("*") on purpose so
# that whichever machine actually builds this (the GitHub Actions Windows
# workflow, or your own machine) resolves the current latest release from
# crates.io itself, rather than trusting a version number I couldn't verify.
# Once a build succeeds, it's worth pinning these to the resolved versions
# (copy them out of the generated Cargo.lock) so future builds are
# reproducible instead of silently picking up new majors.
xcap = "*"
rdev = "*"
image = "*"

[[bin]]
name = "blue-kite-ops"
path = "src/main.rs"
