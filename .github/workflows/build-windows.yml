name: Build Windows exe

# This is how you get the actual .exe installer — Tauri builds against the
# target OS, and this container can't build a Windows binary, so a GitHub
# Actions Windows runner does it instead.
#
# Phase 2.5 batch A (2026-09-26): only the NSIS installer is built now (MSI
# dropped, both here and in src-tauri/tauri.conf.json's bundle.targets) -
# one installer instead of two. For a real "just download one .exe, no zip"
# result, push a VERSION TAG for each release build (not just a push to
# main) - GitHub always wraps an Actions run's "Artifacts" tab download in
# a zip regardless of how many files are inside, but a GitHub Release
# serves each attached file raw. Easiest way to push a tag with no local
# git: go to the repo's "Releases" page -> "Draft a new release" -> click
# "Choose a tag" -> type a new tag like v8.9 -> "+ Create new tag: v8.9 on
# publish" -> fill in a title -> "Publish release". That tag push triggers
# this workflow (see the tags trigger below), and this workflow's own
# tauri-action step then attaches the built blue-kite-ops.exe to that same
# release as a plain downloadable file - no zip. A plain push to main (no
# tag) still works exactly as before for a quick test build, just keep
# downloading that one from the Artifacts tab as usual.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Write .env from repo secrets
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_R2_UPLOAD_WORKER_URL=${{ secrets.VITE_R2_UPLOAD_WORKER_URL }}" >> .env
          echo "VITE_REALTIME_WORKER_URL=${{ secrets.VITE_REALTIME_WORKER_URL }}" >> .env

      - name: Build the Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Blue Kite Ops {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blue-kite-ops-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
