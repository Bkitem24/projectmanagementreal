name: Build Windows exe

# This is how you get the actual .exe/.msi installer — Tauri builds against
# the target OS, and this container can't build a Windows binary, so a
# GitHub Actions Windows runner does it instead. Push to main, or run this
# manually from the Actions tab, and download the installer from the run's
# "Artifacts" section (or from Releases, if you also push a version tag).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Write .env from repo secrets
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_R2_UPLOAD_WORKER_URL=${{ secrets.VITE_R2_UPLOAD_WORKER_URL }}" >> .env
          echo "VITE_REALTIME_WORKER_URL=${{ secrets.VITE_REALTIME_WORKER_URL }}" >> .env

      - name: Build the Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Blue Kite Ops {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,msi

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blue-kite-ops-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
